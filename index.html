<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Focus Timer</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app" id="app">
      <div class="timer-card">
        <p class="eyebrow">Focus Timer</p>
        <h1 id="modeLabel">Focus Session</h1>

        <div class="display-wrap">
          <div id="timeDisplay" class="time-display" aria-live="polite">25:00</div>
        </div>

        <div class="settings">
          <label>
            Focus (min)
            <input id="focusMinutes" type="number" min="1" max="180" value="25" />
          </label>
          <label>
            Break (min)
            <input id="breakMinutes" type="number" min="1" max="60" value="5" />
          </label>
        </div>

        <div class="sound-controls">
          <p>Enable volume for this to work.</p>
          <button id="testSoundButton" class="ghost" type="button">Test bell</button>
        </div>

        <div class="controls">
          <button id="stopSoundButton" class="secondary" type="button" hidden>Stop bell</button>
          <button id="startPauseButton" class="primary">Start</button>
          <button id="resetButton" class="secondary">Reset</button>
          <button id="skipButton" class="ghost">Skip</button>
        </div>
      </div>

    </main>

    <script src="main.js"></script>
  </body>
</html>
