<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Focus Timer</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="floating-timer" aria-live="polite">
      <div class="timer-header">
        <span id="modeLabel">Focus Session</span>
        <button id="collapseButton" class="mini-button" aria-label="Collapse timer">−</button>
      </div>

      <div class="timer-body hidden" id="timerBody">
        <div id="timeDisplay" class="time-display">25:00</div>

        <div class="settings">
          <label>
            Focus
            <input id="focusMinutes" type="number" min="1" max="180" value="25" />
          </label>
          <label>
            Break
            <input id="breakMinutes" type="number" min="1" max="60" value="5" />
          </label>
        </div>

        <div class="controls">
          <button id="startPauseButton" class="primary">Start</button>
          <button id="resetButton" class="secondary">Reset</button>
          <button id="skipButton" class="ghost">Skip</button>
        </div>
      </div>
    </div>

    <div id="reminder" class="reminder hidden" role="alert" aria-live="assertive">
      <div class="reminder-card">
        <h2>Break time</h2>
        <p>Step away from your screen, stretch, and recharge for a few minutes.</p>
        <button id="dismissReminder" class="primary">Dismiss</button>
      </div>
    </div>

    <script src="main.js"></script>
  </body>
</html>
